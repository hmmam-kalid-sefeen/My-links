<script>
        // 1. جلب قائمة الروابط من ملف products.json
        fetch('products.json')
            .then(response => response.json())
            .then(async (urls) => {
                const container = document.getElementById('links');
                container.innerHTML = ''; // تفريغ نص التحميل
                
                // 2. المرور على كل رابط وجلب معلوماته تلقائياً من الـ API
                for (const url of urls) {
                    try {
                        const res = await fetch(`/api/fetch-product?url=${encodeURIComponent(url)}`);
                        const product = await res.json();
                        
                        // إنشاء بطاقة المنتج (Card)
                        const card = document.createElement('a');
                        card.href = product.url || url;
                        card.className = 'product-card';
                        card.target = '_blank';

                        // إضافة الصورة (أو صورة افتراضية إذا كانت فارغة)
                        const defaultImg = "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200"; 
                        const img = document.createElement('img');
                        img.src = product.image && product.image.startsWith('http') ? product.image : defaultImg;
                        img.className = 'product-img';
                        img.alt = product.title;
                        card.appendChild(img);

                        // وعاء النصوص (العنوان والوصف)
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'product-info';

                        // إضافة العنوان
                        const titleSpan = document.createElement('span');
                        titleSpan.className = 'product-title';
                        titleSpan.textContent = product.title || "منتج متميز";
                        infoDiv.appendChild(titleSpan);

                        // إضافة الوصف (يقرأ من product.desc الحقيقي الراجع من الـ API)
                        const descSpan = document.createElement('span');
                        descSpan.className = 'product-desc';
                        
                        if (product.desc && product.desc.trim() !== '') {
                            // إذا الـ API نجح في جلب وصف حقيقي من الموقع، نعرضه هنا
                            descSpan.textContent = product.desc;
                        } else {
                            // وصف احتياطي ذكي في حال لم يجد الموقع وصفاً نصياً
                            try {
                                const domain = new URL(url).hostname.replace('www.', '');
                                descSpan.textContent = `اضغط لمشاهدة تفاصيل المنتج الكاملة مباشرة على موقع ${domain}.`;
                            } catch {
                                descSpan.textContent = "اضغط لزيارة رابط المنتج ومعاينة التفاصيل الكاملة.";
                            }
                        }
                        infoDiv.appendChild(descSpan);

                        card.appendChild(infoDiv);
                        container.appendChild(card);
                    } catch (err) {
                        console.error("خطأ في معالجة الرابط:", url, err);
                    }
                }
            })
            .catch(error => {
                document.getElementById('links').innerHTML = "<div class='loading'>فشل تحميل الروابط الحالية.</div>";
                console.error('خطأ:', error);
            });
    </script>
