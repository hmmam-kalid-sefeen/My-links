<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .links-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .link-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            color: #333;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border: 1px solid #e1e1e1;
        }
        .link-card:hover {
            transform: translateY(-2px);
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #eee;
        }
        .product-title {
            flex-grow: 1;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>Welcome!</h1>
    
    <div id="links" class="links-container">جاري تحميل المنتجات...</div>

    <script>
        // 1. جلب قائمة الروابط من ملف products.json
        fetch('products.json')
            .then(response => response.json())
            .then(async (urls) => {
                const container = document.getElementById('links');
                container.innerHTML = ''; 
                
                // 2. المرور على كل رابط وجلب معلوماته تلقائياً
                for (const url of urls) {
                    try {
                        const res = await fetch(`/api/fetch-product?url=${encodeURIComponent(url)}`);
                        const product = await res.json();
                        
                        const card = document.createElement('a');
                        card.href = product.url || url;
                        card.className = 'link-card';
                        card.target = '_blank';

                        if (product.image) {
                            const img = document.createElement('img');
                            img.src = product.image;
                            img.className = 'product-img';
                            img.alt = product.title;
                            card.appendChild(img);
                        }

                        const titleSpan = document.createElement('span');
                        titleSpan.className = 'product-title';
                        titleSpan.textContent = product.title || "منتج بدون عنوان";
                        card.appendChild(titleSpan);

                        container.appendChild(card);
                    } catch (err) {
                        console.error("خطأ في جلب معلومات الرابط:", url, err);
                    }
                }
            })
            .catch(error => {
                document.getElementById('links').textContent = "فشل تحميل الروابط.";
                console.error('خطأ:', error);
            });
    </script>

</body>
</html>
